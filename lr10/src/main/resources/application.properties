# Параметри підключення до БД. Кожне значення можна перекрити змінною оточення
# (DB_URL, DB_USER, DB_PASSWORD, DB_POOL_SIZE) - так справжній пароль не потрапляє в репозиторій.
# H2 у файловому режимі: файл ./data/cinema.mv.db створюється автоматично.
# COLLATION=UKRAINIAN: ORDER BY name сортує за українською абеткою ("Ї" після "Д"), без урахування регістру.
db.url=jdbc:h2:file:./data/cinema;COLLATION=UKRAINIAN STRENGTH SECONDARY
db.user=sa
db.password=
db.pool.size=5
